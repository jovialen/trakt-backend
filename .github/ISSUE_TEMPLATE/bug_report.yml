name: 🐛 Bug report
description: Something on the site is broken or not behaving as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much detail as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click the theme toggle, the page flashes white before switching.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can this be reproduced?
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected page / URL
      placeholder: /projects, /, /about ...
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Tablet
        - Mobile
        - Not sure
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 120 on Windows 11, Safari on iOS 17
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop any images or videos here (optional).
    validations:
      required: false
